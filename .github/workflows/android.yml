name: Build Studit release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "Release keystore restored."
          else
            echo "No release keystore configured. Gradle will use debug signing."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Signing certificate fingerprints
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          {
            echo "APK: $APK"
            echo "SIZE: $(du -h "$APK" | cut -f1)"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          } | tee certificates.txt

      - name: Upload APK and fingerprints
        uses: actions/upload-artifact@v4
        with:
          name: studit-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            certificates.txt
          if-no-files-found: error
